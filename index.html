<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pinpoint: Holzarten</title>
    
    <!-- 1. Tailwind CSS für das Design laden -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. React und ReactDOM laden -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- 3. Babel laden (damit der Browser JSX versteht) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Verhindert "Bouncing" auf iOS */
        body { overscroll-behavior-y: none; }
        /* Custom Animations */
        @keyframes fadeIn {
          from { opacity: 0; transform: scale(0.98); }
          to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUp {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 h-[100dvh] w-screen overflow-hidden">
    
    <!-- Hier wird die App "eingehängt" -->
    <div id="root"></div>

    <!-- Hier beginnt der eigentliche React-Code -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONS (Inline definiert, damit keine externen Abhängigkeiten nötig sind) ---
        const IconBase = ({ d, color = "currentColor", size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {d}
            </svg>
        );

        const Microscope = (p) => <IconBase {...p} d={<><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></>} />;
        const CheckCircle = (p) => <IconBase {...p} d={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />;
        const XCircle = (p) => <IconBase {...p} d={<><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></>} />;
        const Trophy = (p) => <IconBase {...p} d={<><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 1 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></>} />;
        const Flame = (p) => <IconBase {...p} d={<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-2.24-4.039-3.043-5.804A6 6 0 0 0 2.5 8 5.48 5.48 0 0 0 8 13.5v1c0 .5.33 1 .5 1a2.5 2.5 0 0 0 2.5-2.5V8h1v5a4 4 0 0 0 4 4 3 3 0 0 0 3-3c0-3.33-4-5-4-9 0 2.5-3 5-3 7.5a2.5 2.5 0 0 1-2.5 2.5z"/>} />;
        const Heart = (p) => <IconBase {...p} fill={p.fill ? "currentColor" : "none"} d={<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>} />;
        const ArrowRight = (p) => <IconBase {...p} d={<><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>} />;
        const RefreshCw = (p) => <IconBase {...p} d={<><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></>} />;
        const Search = (p) => <IconBase {...p} d={<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>} />;
        const Lightbulb = (p) => <IconBase {...p} d={<><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2.4 1.5-3.8 0-3.2-2.8-6-6-6S6 4.8 6 8c0 1.4.5 2.8 1.5 3.8.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></>} />;
        const Target = (p) => <IconBase {...p} d={<><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>} />;
        const TreePine = (p) => <IconBase {...p} d={<><path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.9-1.5l2.9-4H8.6a1 1 0 0 1-.8-1.5l5.5-7.5a1 1 0 0 1 1.6 0l5.5 7.5a1 1 0 0 1-.8 1.5H18.2l2.9 4a1 1 0 0 1-.9 1.5H17Z"/><path d="M12 22v-3"/></>} />;


        // --- HAUPTANWENDUNG ---
        const GamifiedMicroscopyApp = () => {
          // Game State
          const [currentRoundIndex, setCurrentRoundIndex] = useState(0);
          const [score, setScore] = useState(0);
          const [streak, setStreak] = useState(0);
          const [lives, setLives] = useState(3);
          const [gameState, setGameState] = useState('start'); // start, playing, gameover, completed
          
          // Pinpoint Specific State
          const [revealedClues, setRevealedClues] = useState(1);
          const [roundStatus, setRoundStatus] = useState('active'); // active, success, failure
          const [selectedOption, setSelectedOption] = useState(null);
          const [xpGained, setXpGained] = useState(0);

          // Ref für den Scroll-Container
          const scrollContainerRef = useRef(null);

          // Effekt für automatisches Scrollen nach OBEN bei Rundenbeginn
          useEffect(() => {
            if (scrollContainerRef.current) {
                // Scrollt den Container sofort nach oben, wenn sich die Runde ändert
                scrollContainerRef.current.scrollTo({ top: 0, behavior: 'smooth' });
            }
          }, [currentRoundIndex, gameState]);

          // Content: Nadelholzbestimmung
          const challenges = [
            {
              id: 1,
              category: "Nadelholz-Bestimmung",
              answer: "Kiefer",
              clues: [
                "Ich besitze Harzkanäle.",
                "Meine Epithelzellen sind dickwandig.",
                "In den Kreuzungsfeldern zeige ich große Fenstertüpfel.",
                "Meine Kantentracheiden sind gezahnt."
              ],
              options: ["Fichte", "Kiefer", "Tanne", "Douglasie"],
              explanation: "Die Kiefer (Pinus sylvestris) lässt sich sicher durch dickwandige Epithelzellen und große Fenstertüpfel identifizieren."
            },
            {
              id: 2,
              category: "Nadelholz-Bestimmung",
              answer: "Tanne",
              clues: [
                "Ich besitze keine Harzkanäle.",
                "Ich habe keine schraubenartigen Verdickungen.",
                "Meine Kreuzungsfeldtüpfel sind taxodioid.",
                "Meine Holzstrahlen sind meist homogen."
              ],
              options: ["Tanne", "Lärche", "Eibe", "Fichte"],
              explanation: "Die Tanne (Abies) hat keine Harzkanäle. Ihre taxodioiden Tüpfel sind ein entscheidendes Merkmal zur Abgrenzung."
            },
            {
              id: 3,
              category: "Nadelholz-Bestimmung",
              answer: "Lärche",
              clues: [
                "Ich besitze Harzkanäle.",
                "Meine Epithelzellen sind dünnwandig.",
                "Meine Kreuzungsfeldtüpfel sind piceoid.",
                "Charakteristisch für mich sind die Zwillingstüpfel."
              ],
              options: ["Kiefer", "Douglasie", "Lärche", "Wacholder"],
              explanation: "Die Lärche (Larix) ähnelt der Fichte, unterscheidet sich aber im Mikroskop oft durch die markanten Zwillingstüpfel."
            },
            {
              id: 4,
              category: "Nadelholz-Bestimmung",
              answer: "Eibe",
              clues: [
                "Ich besitze keine Harzkanäle.",
                "Meine Kreuzungsfeldtüpfel sind cupressoid.",
                "Ich weise deutliche schraubenartige Verdickungen auf.",
                "Mein Holz ist sehr dicht und hart."
              ],
              options: ["Wacholder", "Eibe", "Tanne", "Strobe"],
              explanation: "Die Eibe (Taxus) ist leicht an den Spiralverdickungen (schraubenartig) in Kombination mit fehlenden Harzkanälen zu erkennen."
            },
            {
              id: 5,
              category: "Nadelholz-Bestimmung",
              answer: "Douglasie",
              clues: [
                "Ich besitze Harzkanäle mit dünnwandigen Epithelzellen.",
                "Meine Kreuzungsfeldtüpfel sind piceoid.",
                "Anders als die Fichte besitze ich schraubenartige Verdickungen.",
                "Meine Spiralen sind oft feiner als bei der Eibe."
              ],
              options: ["Fichte", "Douglasie", "Kiefer", "Lärche"],
              explanation: "Die Douglasie (Pseudotsuga) wird oft mit der Fichte verwechselt, lässt sich aber durch die Spiralverdickungen abgrenzen."
            }
          ];

          const calculatePotentialPoints = () => {
            const maxPoints = 200;
            const penaltyPerClue = 40;
            return Math.max(40, maxPoints - ((revealedClues - 1) * penaltyPerClue));
          };

          const handleRevealClue = () => {
            if (revealedClues < challenges[currentRoundIndex].clues.length) {
              setRevealedClues(revealedClues + 1);
            }
          };

          const handleGuess = (option) => {
            if (roundStatus !== 'active') return;

            setSelectedOption(option);
            const correct = option === challenges[currentRoundIndex].answer;

            if (correct) {
              const points = calculatePotentialPoints() + (streak * 20);
              setScore(score + points);
              setStreak(streak + 1);
              setXpGained(points);
              setRoundStatus('success');
            } else {
              setLives(lives - 1);
              setStreak(0);
              setXpGained(0);
              setRoundStatus('failure');
              setRevealedClues(challenges[currentRoundIndex].clues.length);
            }

            if (!correct && lives - 1 <= 0) {
              setTimeout(() => setGameState('gameover'), 2500);
            }
          };

          const nextRound = () => {
            setRoundStatus('active');
            setSelectedOption(null);
            setRevealedClues(1);
            if (currentRoundIndex < challenges.length - 1) {
              setCurrentRoundIndex(currentRoundIndex + 1);
            } else {
              setGameState('completed');
            }
          };

          const restartGame = () => {
            setScore(0);
            setStreak(0);
            setLives(3);
            setCurrentRoundIndex(0);
            setRoundStatus('active');
            setSelectedOption(null);
            setRevealedClues(1);
            setGameState('start');
          };

          const StartScreen = () => (
            <div className="flex flex-col items-center justify-center h-full p-8 text-center space-y-6 animate-fade-in">
              <div className="bg-orange-100 p-6 rounded-full mb-4 ring-8 ring-orange-50">
                <TreePine size={64} className="text-orange-600" />
              </div>
              <h1 className="text-3xl font-black text-gray-800 tracking-tight">Pinpoint: Holzarten</h1>
              <p className="text-gray-600 max-w-xs text-lg leading-relaxed">
                Bestimmen Sie das Nadelholz anhand mikroskopischer Merkmale.
              </p>
              
              <div className="grid grid-cols-2 gap-3 w-full max-w-xs mt-4">
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-orange-100 flex flex-col items-center">
                   <Lightbulb className="w-6 h-6 text-yellow-500 mb-2" />
                   <span className="text-xs font-bold text-gray-400 uppercase">Strategie</span>
                   <span className="text-sm font-semibold text-gray-700">Merkmale</span>
                </div>
                <div className="bg-white p-4 rounded-2xl shadow-sm border border-orange-100 flex flex-col items-center">
                   <Trophy className="w-6 h-6 text-orange-500 mb-2" />
                   <span className="text-xs font-bold text-gray-400 uppercase">Ziel</span>
                   <span className="text-sm font-semibold text-gray-700">Max XP</span>
                </div>
              </div>

              <button 
                onClick={() => setGameState('playing')}
                className="mt-8 px-10 py-4 bg-orange-600 text-white rounded-2xl font-bold text-xl hover:bg-orange-700 transform hover:scale-105 transition-all shadow-xl hover:shadow-orange-200 flex items-center"
              >
                Quiz Starten <ArrowRight className="ml-2" />
              </button>
            </div>
          );

          const GameOverScreen = () => (
            <div className="flex flex-col items-center justify-center h-full p-8 text-center animate-fade-in">
              <div className="bg-red-100 p-6 rounded-full mb-6">
                <XCircle size={64} className="text-red-500" />
              </div>
              <h2 className="text-3xl font-bold text-gray-800 mb-2">Bestimmung gescheitert</h2>
              <p className="text-gray-600 mb-8">Achten Sie beim nächsten Mal genauer auf die Tüpfelformen.</p>
              <div className="bg-gray-100 px-8 py-4 rounded-2xl mb-8">
                <span className="block text-xs text-gray-500 uppercase font-bold">Endstand</span>
                <span className="text-3xl font-black text-gray-800">{score} XP</span>
              </div>
              <button 
                onClick={restartGame}
                className="px-8 py-3 bg-gray-900 text-white rounded-xl font-bold hover:bg-black transition-colors flex items-center shadow-lg"
              >
                <RefreshCw className="mr-2" size={20} /> Neustarten
              </button>
            </div>
          );

          const CompletedScreen = () => (
            <div className="flex flex-col items-center justify-center h-full p-8 text-center animate-fade-in">
              <div className="bg-yellow-100 p-6 rounded-full mb-6 animate-pulse">
                <Trophy size={64} className="text-yellow-600" />
              </div>
              <h2 className="text-2xl font-bold text-gray-800 mb-2">Holzanatomie-Experte!</h2>
              <p className="text-gray-600 mb-8">Sie haben alle Holzarten korrekt bestimmt.</p>
              
              <div className="bg-orange-50 p-8 rounded-3xl border border-orange-100 mb-8 w-full max-w-xs">
                <div className="text-xs text-orange-500 uppercase font-bold tracking-widest mb-2">Gesamtpunktzahl</div>
                <div className="text-5xl font-black text-orange-900">{score}</div>
                <div className="text-orange-400 font-medium mt-2">XP gesammelt</div>
              </div>

              <button 
                onClick={restartGame}
                className="px-8 py-3 bg-orange-600 text-white rounded-xl font-bold hover:bg-orange-700 transition-colors flex items-center shadow-lg shadow-orange-200"
              >
                <RefreshCw className="mr-2" size={20} /> Erneut spielen
              </button>
            </div>
          );

          // --- Main Game Screen ---

          return (
            <div className="w-full h-screen bg-slate-100 flex items-center justify-center font-sans md:p-4 selection:bg-orange-100 overflow-hidden">
              {/* Geänderte Höhe: md:h-[80vh] und md:max-h-[720px] für kompaktes Design */}
              <div className="w-full h-full md:max-w-md md:h-[80vh] md:max-h-[720px] bg-white md:rounded-[2.5rem] md:shadow-2xl md:border-8 md:border-white overflow-hidden flex flex-col relative">
                
                {gameState === 'playing' && (
                  <div className="bg-white/90 backdrop-blur-md border-b border-orange-100 p-3 flex justify-between items-center sticky top-0 z-20">
                    <div className="flex items-center space-x-2">
                       <div className="bg-orange-50 p-2 rounded-lg">
                          <Microscope className="w-5 h-5 text-orange-600" />
                       </div>
                       <div className="flex flex-col">
                         <span className="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Level {currentRoundIndex + 1}/{challenges.length}</span>
                         <span className="text-xs font-bold text-gray-800 truncate max-w-[100px]">{challenges[currentRoundIndex].category}</span>
                       </div>
                    </div>
                    
                    <div className="flex items-center gap-2">
                      <div className="flex items-center bg-slate-50 px-2 py-1 rounded-full border border-slate-100">
                        <Heart className="w-3 h-3 text-red-500 fill-current mr-1" />
                        <span className="font-bold text-xs text-slate-700">{lives}</span>
                      </div>
                      <div className="bg-orange-600 text-white px-3 py-1 rounded-full font-bold text-xs shadow-md shadow-orange-200">
                        {score} XP
                      </div>
                    </div>
                  </div>
                )}

                <div 
                  ref={scrollContainerRef}
                  className="flex-1 flex flex-col relative bg-slate-50/50 overflow-y-auto"
                >
                  {gameState === 'start' && <StartScreen />}
                  {gameState === 'gameover' && <GameOverScreen />}
                  {gameState === 'completed' && <CompletedScreen />}
                  
                  {gameState === 'playing' && (
                    <div className="p-4 flex flex-col min-h-full animate-fade-in w-full">
                      
                      {/* ÄNDERUNG: mb-3 zu mb-1 reduziert */}
                      <div className="flex-1 mb-1">
                        <div className="flex justify-between items-end mb-4">
                          <h3 className="text-md font-bold text-slate-700 flex items-center">
                            <Search className="w-4 h-4 mr-2 text-orange-500" />
                            Merkmale
                          </h3>
                          <div className="text-[10px] font-bold bg-green-100 text-green-700 px-2 py-1 rounded">
                             Max: {calculatePotentialPoints()} Pkt
                          </div>
                        </div>

                        <div className="space-y-3">
                          {challenges[currentRoundIndex].clues.map((clue, index) => {
                            const isRevealed = index < revealedClues;
                            return (
                              <div 
                                key={index}
                                className={`
                                  p-2 rounded-xl border-l-4 transition-all duration-500 ease-out flex items-center
                                  ${isRevealed 
                                    ? 'bg-white border-orange-500 shadow-sm opacity-100 translate-x-0' 
                                    : 'bg-slate-100 border-slate-300 opacity-40 translate-x-4 blur-[1px]'
                                  }
                                `}
                              >
                                 <div className={`w-6 h-6 rounded-full flex items-center justify-center mr-3 font-bold text-xs flex-shrink-0 ${isRevealed ? 'bg-orange-100 text-orange-600' : 'bg-slate-200 text-slate-400'}`}>
                                   {index + 1}
                                 </div>
                                 <p className={`text-sm md:text-base font-medium ${isRevealed ? 'text-slate-700' : 'text-slate-400 select-none'}`}>
                                   {isRevealed ? clue : "Verschlüsselt..."}
                                 </p>
                              </div>
                            );
                          })}
                        </div>

                        {revealedClues < challenges[currentRoundIndex].clues.length && roundStatus === 'active' && (
                          /* ÄNDERUNG: mt-6 zu mt-2 reduziert */
                          <button 
                            onClick={handleRevealClue}
                            className="mt-2 w-full text-sm font-bold text-red-600 bg-red-100 border-2 border-red-200 hover:bg-red-200 hover:border-red-300 px-4 py-2 rounded-xl transition-all flex justify-center items-center shadow-sm"
                          >
                            <Lightbulb className="w-4 h-4 mr-2" />
                            Tipp anzeigen (-40 Pkt)
                          </button>
                        )}
                      </div>

                      {/* ÄNDERUNG: pt-2 zu pt-1 reduziert */}
                      <div className="mt-auto pt-1 border-t border-slate-200 bg-slate-50/50 pb-4">
                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 text-center">Welches Holz ist es?</h3>
                        
                        <div className="grid grid-cols-2 gap-3">
                          {challenges[currentRoundIndex].options.map((option) => {
                            const isSelected = selectedOption === option;
                            const isCorrect = option === challenges[currentRoundIndex].answer;
                            
                            let btnClass = "bg-white border-slate-200 hover:border-orange-300 hover:shadow-md text-slate-700";
                            
                            if (roundStatus !== 'active') {
                               if (isCorrect) btnClass = "bg-green-100 border-green-500 text-green-800 ring-1 ring-green-500";
                               else if (isSelected && !isCorrect) btnClass = "bg-red-50 border-red-300 text-red-800 opacity-60";
                               else btnClass = "bg-slate-50 border-slate-100 text-slate-400 opacity-50";
                            }

                            return (
                              <button
                                key={option}
                                onClick={() => handleGuess(option)}
                                disabled={roundStatus !== 'active'}
                                className={`
                                  relative p-2 rounded-xl border-2 font-bold text-sm transition-all duration-200 text-left min-h-[54px] flex items-center
                                  ${btnClass}
                                `}
                              >
                                {option}
                                {roundStatus === 'success' && isCorrect && <CheckCircle className="absolute right-2 top-2 text-green-600 w-4 h-4" />}
                                {roundStatus === 'failure' && isSelected && !isCorrect && <XCircle className="absolute right-2 top-2 text-red-500 w-4 h-4" />}
                              </button>
                            )
                          })}
                        </div>

                        {roundStatus !== 'active' && (
                          <div className="mt-4 animate-slide-up relative z-30 flex flex-col">
                            
                            <button 
                              onClick={nextRound}
                              className={`w-full py-4 rounded-xl font-bold text-white shadow-lg transition-all hover:scale-[1.01] flex justify-center items-center text-lg mb-4
                                ${roundStatus === 'success' ? 'bg-orange-600 hover:bg-orange-700' : 'bg-slate-800 hover:bg-slate-900'}`}
                            >
                              {currentRoundIndex < challenges.length - 1 ? 'Nächste Probe' : 'Ergebnis ansehen'}
                              <ArrowRight className="ml-2 w-5 h-5" />
                            </button>

                            <div className={`p-4 rounded-xl text-sm ${roundStatus === 'success' ? 'bg-green-50 border border-green-100' : 'bg-red-50 border border-red-100'}`}>
                              <p className="text-slate-800 leading-relaxed">
                                <span className="font-bold mr-2">{roundStatus === 'success' ? 'Korrekt!' : 'Leider falsch.'}</span>
                                {challenges[currentRoundIndex].explanation}
                              </p>
                            </div>

                          </div>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GamifiedMicroscopyApp />);
    </script>
</body>
</html>
